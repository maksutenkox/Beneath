<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#0b1014" />
    <title>Убежище</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" class="game-shell" aria-label="Убежище — тестовая сцена">
      <canvas id="game-canvas" aria-label="Изометрическая карта убежища"></canvas>
      <section class="scene-label" aria-live="polite">
        <span class="eyebrow">BENEATH</span>
        <h1>Убежище</h1>
        <p id="platform-status">Запуск…</p>
      </section>
      <section class="resource-hud" aria-label="Ресурсы убежища">
        <span title="Population"><small>POP</small><b data-population>0</b></span>
        <span title="Food"><small>FOOD</small><b data-resource="food">0</b></span>
        <span title="Water"><small>WATER</small><b data-resource="water">0</b></span>
        <span title="Power"><small>POWER</small><b data-resource="power">0</b></span>
      </section>
      <aside class="repair-panel" data-repair-panel hidden aria-label="Ремонт сектора">
        <button class="repair-panel__close" data-repair-close aria-label="Закрыть">×</button>
        <span class="eyebrow">ВОССТАНОВЛЕНИЕ СЕКТОРА</span>
        <h2 data-repair-name>Сектор</h2>
        <p>Состояние: <strong data-repair-status>DAMAGED</strong></p>
        <h3>Необходимые материалы</h3>
        <ul data-repair-list></ul>
        <button class="repair-panel__action" data-repair-action>Ремонтировать</button>
      </aside>
      <div class="status-toast" data-status-toast hidden role="status"></div>
      <div class="mobile-controls" aria-label="Мобильное управление">
        <div class="analog-stick" data-stick role="application" aria-label="Аналоговый стик движения">
          <div class="analog-stick__ring"></div>
          <div class="analog-stick__knob" data-stick-knob></div>
        </div>
        <button class="interaction-button" data-interact aria-label="Взаимодействовать" disabled>
          <span class="interaction-button__key">E</span>
          <span data-interact-label>Действие</span>
        </button>
      </div>
      <aside class="orientation-gate">
        <div>
          <span aria-hidden="true">↻</span>
          <strong>Поверните устройство</strong>
          <p>Игра работает в горизонтальной ориентации.</p>
        </div>
      </aside>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
