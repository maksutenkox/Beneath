<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#070b0e" />
    <meta name="screen-orientation" content="portrait" />
    <title>Below Protocol</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app" class="game-shell" aria-label="Below Protocol — безопасный корпоративный этаж">
      <canvas id="game-canvas" aria-label="Двухмерная игровая сцена, вид сбоку"></canvas>
      <section class="health-hud" data-hearts aria-label="Здоровье"></section>
      <section class="system-label" aria-live="polite">
        <strong>BELOW PROTOCOL</strong><span>SAFE HUB / FLOOR ??</span><small id="platform-status">ЗАПУСК…</small>
      </section>
      <aside class="workbench-panel" data-workbench-panel hidden aria-label="Оружейный верстак">
        <span class="panel-kicker">WEAPON WORKBENCH</span>
        <h2 data-workbench-weapon>Current Weapon</h2>
        <p data-workbench-stats>LVL 1 · DMG 1</p>
        <button data-workbench-upgrade>UPGRADE</button>
        <button data-workbench-modify>MODIFY</button>
        <button class="panel-close" data-workbench-close>CLOSE</button>
      </aside>
      <div class="status-toast" data-status-toast hidden role="status"></div>
      <div class="mobile-controls" aria-label="Мобильное управление">
        <div class="move-controls">
          <button class="control-button control-button--move" data-control="left" aria-label="Двигаться влево">←</button>
          <button class="control-button control-button--move" data-control="right" aria-label="Двигаться вправо">→</button>
        </div>
        <button class="control-button control-button--jump" data-control="jump" aria-label="Прыжок">↑<small>JUMP</small></button>
        <button class="control-button control-button--attack" data-control="attack" aria-label="Атака"><span>⌁</span><small>ATTACK</small></button>
        <button class="interaction-button" data-control="interact" aria-label="Взаимодействовать" hidden disabled><b>E</b><span data-interact-label>ВЗАИМОДЕЙСТВОВАТЬ</span></button>
      </div>
      <aside class="landscape-hint"><strong>PORTRAIT MODE</strong><span>Поверните устройство вертикально</span></aside>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
